<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penasihat Ditugaskan</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #e5ddd5; }
        .card { 
            text-align: center; 
            width: 88%; 
            max-width: 350px; 
            background: white; 
            padding: 40px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box;
        }
        .ws-icon { width: 65px; height: 65px; background: #25D366; color: white; font-size: 35px; line-height: 65px; border-radius: 50%; margin: 0 auto 20px; display: block; }
        .title { font-size: 20px; font-weight: bold; margin-bottom: 12px; color: #075E54; width: 100%; }
        .text { font-size: 15px; color: #4a4a4a; line-height: 1.5; margin-bottom: 30px; width: 100%; box-sizing: border-box; }
        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #25D366; 
            color: white; 
            text-decoration: none; 
            padding: 16px; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 17px; 
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); 
            border: none; 
            width: 100%;            
            max-width: 280px;      
            margin: 0 auto;        
            cursor: pointer; 
            box-sizing: border-box; 
        }
        .btn:before { content: '💬'; margin-right: 8px; font-size: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="ws-icon">✓</div>
        <div class="title">Penasihat Ditugaskan!</div>
        <div class="text">
            Permohonan anda telah berjaya diproses. Sila klik butang di bawah untuk <b>menghubungi kami</b> sekarang bagi mendapatkan maklumat lanjut:
        </div>
        <!-- 已更新为 lihi2.me 新链接 -->
        <a href="https://lihi2.me/CZCJJ" class="btn">HUBUNGI KAMI SEKARANG</a>
    </div>
</body>
</html>
