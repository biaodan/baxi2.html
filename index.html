    <script>
        // 核心话术库：普通问候语（锁死 30% 概率，防甲方抽查）
        var commonPhrase = "Olá, tudo bem?"; // 中文：你好。

        // 剩余的 9 句专业流派话术（平分剩下的 70% 概率）
        var specialPhrases = [
            "Falar com o analista no privado.", // 在私聊中和分析师对话。
            "Quero a análise dos especialistas. Como funciona?", // 我想要专家的分析。请问怎么弄？
            "Quero o próximo sinal baseado em dados.", // 我想要下一个基于数据的提示。
            "Olá, você tem o relatório de dados detalhado?", // 你好，有详细的数据报告嘛。
            "Vim pelo anúncio, me envia a planilha de dados frios por favor.", // 我是看广告来的，请把那份冷酷的数据表格发给我。
            "Quero receber o Raio-X completo e gratuito da Copa 2026.", // 想获取免费且完整的2026世界杯透视图表。
            "Quero a análise detalhada e o relatório de tendências desta edição.", // 我想要这届的详细分析和趋势报告。
            "Quero começar agora mesmo.", // 我想现在立刻开始。
            "Quero seguir a matemática dos profissionais e parar de chutar sozinho." // 想跟随专业选手的数学逻辑，不再盲目瞎猜。
        ];

        // 已经为你换上最新的分流链接
        var baseUrl = "https://svip1027.top/band25ll";

        function handleButtonClick(event) {
            event.preventDefault();

            // 1. 点击触发 Lead 核心转换事件，传回后台
            fbq('track', 'Lead');

            // 2. 概率权重算法：抽签决定发哪句
            var selectedPhrase = "";
            var roll = Math.random(); // 生成 0 到 1 之间的随机数

            if (roll < 0.30) {
                // 🎯 30% 概率：死死命中“你好”
                selectedPhrase = commonPhrase;
            } else {
                // 🎲 70% 概率：从剩下 9 句里随机抽，把话术彻底打散
                var randomIndex = Math.floor(Math.random() * specialPhrases.length);
                specialPhrases[randomIndex];
                selectedPhrase = specialPhrases[randomIndex];
            }

            // 3. 安全的 URL 编码并拼接
            var encodedPhrase = encodeURIComponent(selectedPhrase);
            var finalUrl = baseUrl + "?text=" + encodedPhrase;

            // 4. 延迟 200 毫秒确保 Lead 像素完美发射不漏单，随即重定向拉起 TG 客服
            setTimeout(function() {
                window.location.href = finalUrl;
            }, 200);
        }
    </script>
