    <script>
        // 🎯 核心伪装词：死死锁死 30% 的高触发概率（安全防查首选）
        var commonPhrase = "Olá, sou torcedor e vim pelo anúncio."; // 中文：你好，我是球迷，看广告来的。

        // 🎲 剩余的 8 句专业流派话术（完全平分剩下的 70% 概率）
        var specialPhrases = [
            "Falar com o analista no privado.", // 1. 在私聊中和分析师对话。
            "Quero a análise dos especialistas. Como funciona?", // 2. 我想要专家的分析。请问怎么弄？

            "Vim pelo anúncio, me envia a planilha de dados frios por favor.", // 5. 我是看广告来的，请把那份冷酷的数据表格发给我。
            "Quero receber o Raio-X completo e gratuito da Copa 2026.", // 6. 想获取免费且完整的2026世界杯透视图表。
            "Quero a análise detalhada e o relatório de tendências desta edição.", // 7. 我想要这届的详细分析和趋势报告。
            "Gostaria de saber mais informações." // 8. 我想了解一下。
        ];

        // 🚀 直连你的全新专用 Telegram 客服号
        var tgUsername = "fffdd90";

        function handleButtonClick(event) {
            event.preventDefault();

            // 点击按钮时，立刻触发 Lead 核心转化事件，传回 Meta 后台
            fbq('track', 'Lead');

            // 核心黑科技：多段概率权重算法
            var selectedPhrase = "";
            var roll = Math.random(); // 生成 0 到 1 之间的随机数

            if (roll < 0.30) {
                // 🎯 30% 概率：直接命中核心伪装词，伪装真人行为
                selectedPhrase = commonPhrase;
            } else {
                // 🎲 70% 概率：从剩下 8 句专业词里盲抽，彻底打散痕迹
                var randomIndex = Math.floor(Math.random() * specialPhrases.length);
                selectedPhrase = specialPhrases[randomIndex];
            }

            // 将抽中的话术进行标准的 URL 编码
            var encodedPhrase = encodeURIComponent(selectedPhrase);
            
            // 官方标准直连带字强拉格式（100% 成功往老哥聊天框里注入文字）
            var finalUrl = "https://t.me/" + tgUsername + "?text=" + encodedPhrase;

            // 延迟 200 毫秒确保像素 Lead 成功发射并完美回传，随即极速唤起 TG 聊天
            setTimeout(function() {
                window.location.href = finalUrl;
            }, 200);
        }
    </script>
